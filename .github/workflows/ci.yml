name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tauri feature check
        run: cargo check --manifest-path src-tauri/Cargo.toml --features tauri-app
